name: Auto Assign PRs

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened]

  workflow_dispatch:
jobs:
  assign-pr:
    uses: clouddrove/github-shared-workflows/.github/workflows/pr-auto-assignee.yml@master
    secrets:
      GITHUB: ${{ secrets.GITHUB }}
    with:
      assignees: 'clouddrove-ci'
